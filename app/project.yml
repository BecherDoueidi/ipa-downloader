# XcodeGen spec — generates IPAPoC.xcodeproj on the macOS CI runner (`xcodegen generate`).
# Keeping the project as YAML avoids hand-editing a .pbxproj from Windows.
name: IPAPoC
options:
  bundleIdPrefix: dev.ipapoc
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  IPAPoC:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: IPA PoC
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocalNetworkUsageDescription: "IPA PoC looks up this iPhone's own Remote Pairing service so it can install apps on this device."
        NSBonjourServices:
          - _remotepairing._tcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ipapoc.app
        TARGETED_DEVICE_FAMILY: "1"
        # Rust static library + C module map produced by the CI step before xcodebuild.
        SWIFT_INCLUDE_PATHS: $(PROJECT_DIR)/../bridge/include
        HEADER_SEARCH_PATHS: $(PROJECT_DIR)/../bridge/include
        LIBRARY_SEARCH_PATHS: $(PROJECT_DIR)/../bridge/target/aarch64-apple-ios/release
        OTHER_LDFLAGS: ["-lipabridge", "-lc++", "-framework", "Security", "-framework", "SystemConfiguration"]
        # Device-only build: the Rust lib is compiled for aarch64-apple-ios only.
        SUPPORTED_PLATFORMS: iphoneos
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
